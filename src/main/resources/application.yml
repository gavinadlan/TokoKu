spring:
  application:
    name: tokoku
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tokoku}
    username: ${DATABASE_USER:tokoku}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # skema hanya dikelola Flyway
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    secret: ${JWT_SECRET:}          # kosong di dev = kunci acak sementara
    expiration-minutes: 30
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  payment:
    provider: ${APP_PAYMENT_PROVIDER:midtrans}   # midtrans | fake (fake dilarang di prod)
    midtrans:
      server-key: ${MIDTRANS_SERVER_KEY:}
      client-key: ${MIDTRANS_CLIENT_KEY:}
      snap-url: ${MIDTRANS_API_URL:https://app.sandbox.midtrans.com/snap/v1/transactions}
  order:
    expiry-minutes: ${APP_ORDER_EXPIRY_MINUTES:60}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
