spring:
  application:
    name: tokoku
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tokoku}
    username: ${DATABASE_USER:tokoku}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # skema hanya dikelola Flyway
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    secret: ${JWT_SECRET:}          # kosong di dev = kunci acak sementara
    expiration-minutes: 30
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
