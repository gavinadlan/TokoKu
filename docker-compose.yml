services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tokoku
      POSTGRES_USER: tokoku
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5432}:5432"   # agar app lokal bisa konek; ubah DB_PORT jika 5432 terpakai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokoku"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/tokoku
      DATABASE_USER: tokoku
      DATABASE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (min 32 chars)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:-}
      APP_PAYMENT_PROVIDER: ${APP_PAYMENT_PROVIDER:-midtrans}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      APP_IMAGES_PROVIDER: ${APP_IMAGES_PROVIDER:-cloudinary}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      MIDTRANS_API_URL: ${MIDTRANS_API_URL:-https://app.sandbox.midtrans.com/snap/v1/transactions}
    ports:
      - "8080:8080"
volumes:
  pgdata:
